name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      live_app_url:
        description: 'Optional live Vercel URL for instant OTA updates (e.g. https://your-app.vercel.app)'
        required: false
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Stage offline SPA bundle for Capacitor
        env:
          LIVE_APP_URL: ${{ github.event.inputs.live_app_url || vars.LIVE_APP_URL || '' }}
        run: npm run apk:prepare

      - name: Generate Android project, apply native App Blocker & sync assets
        env:
          LIVE_APP_URL: ${{ github.event.inputs.live_app_url || vars.LIVE_APP_URL || '' }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/apply-android-native.mjs
          npx cap sync android

      - name: Ensure app icons
        run: |
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
          cp public/pwa-192x192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp public/pwa-192x192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png || true

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Leave-It-Timer-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
